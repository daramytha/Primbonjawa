name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout kode dari repositori
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Setup Java Development Kit (JDK)
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Setup Framework Flutter
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'
        cache: true

    # 4. Re-generate struktur folder Android dengan nama proyek yang sesuai pubspec.yaml
    - name: Repair Android Project Structure
      run: flutter create . --platforms=android --project-name=primbon_jawa_app --org=com.example

    # 5. Unduh dependensi Flutter
    - name: Install Dependencies
      run: flutter pub get

    # 6. Build APK Release
    - name: Build APK
      run: flutter build apk --release

    # 7. Upload file APK ke Artifacts
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: primbon-jawa-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
